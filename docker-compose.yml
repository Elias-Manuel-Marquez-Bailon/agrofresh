services:
  db:
    image: mysql:8.0
    container_name: agrofresh-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/Mexico_City
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # Sin "ports": el 3306 NO se expone al host en producción.
    # Solo es accesible por los otros contenedores en la red interna.
    networks:
      - agrofresh-data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    image: agrofresh-backend:latest
    container_name: agrofresh-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    # Sin "ports": el backend solo se alcanza a través de Nginx (/api)
    networks:
      - agrofresh-data
      - agrofresh-web

  frontend:
    build: ./frontend
    image: agrofresh-frontend:latest
    container_name: agrofresh-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - agrofresh-web

volumes:
  db_data:

networks:
  # Red PRIVADA de datos: solo db y backend. "internal: true" la aísla de
  # internet y del host (ningún contenedor de esta red se publica).
  agrofresh-data:
    driver: bridge
    internal: true
  # Red de aplicación: frontend (Nginx) <-> backend para el proxy /api
  agrofresh-web:
    driver: bridge
