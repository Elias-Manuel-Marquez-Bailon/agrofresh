spring.application.name=backend
server.port=8080

# ---------- Base de datos ----------
# En Docker, docker-compose pasa DB_HOST=db y el resto desde .env.
# Los valores después de ":" son los de desarrollo local (tu MySQL instalado).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agrofresh}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema lo crea db/init.sql; Hibernate no toca las tablas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
# El valor por defecto es SOLO para desarrollo local. En producción se toma de .env
jwt.secret=${JWT_SECRET:clave-local-de-desarrollo-solo-para-pruebas-123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------- CORS ----------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Subida de imágenes ----------
# El frontend las reduce antes de subirlas; el backend rechaza más de 2 MB.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
